services:
  api:
    build:
      context: .
      target: runtime
    image: task-manager-api:latest
    container_name: task-manager-api
    ports:
      - "5000:5000"
    environment:
      - DATABASE_PATH=/data/tasks.db
      - APP_VERSION=1.0.0
    volumes:
      - task-data:/data
    restart: unless-stopped

volumes:
  task-data:
